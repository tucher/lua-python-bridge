name: CI

on:
  push:
  pull_request:

jobs:
  lua-module:
    name: Lua ${{ matrix.lua }} host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        lua: ["5.3.6", "5.4.7", "5.5.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build Lua ${{ matrix.lua }} (with API checks)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y libreadline-dev; target=linux; else target=macosx; fi
          curl -sSfL https://www.lua.org/ftp/lua-${{ matrix.lua }}.tar.gz | tar xz
          make -C lua-${{ matrix.lua }} -j4 $target MYCFLAGS=-DLUA_USE_APICHECK
      - name: Build the Lua module
        run: |
          cmake -S . -B build -DLUA_INCLUDE_DIR=$PWD/lua-${{ matrix.lua }}/src -DLPB_WARNINGS_AS_ERRORS=ON
          cmake --build build
          python3 tests/check_symbols.py lua-module build/python.so
      - name: Lua tests with every Python (the same binary)
        shell: bash
        run: |
          for v in 3.10 3.11 3.12 3.13 3.14; do
            echo "::group::Python $v"
            LUA_CPATH="$PWD/build/?.so" LUA_PYTHON_EXECUTABLE="$(command -v python$v)" \
              lua-${{ matrix.lua }}/src/lua tests/lua/run.lua
            echo "::endgroup::"
          done

  python-module:
    name: Python ${{ matrix.python }} host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests/python -v
      - if: runner.os != 'Windows'
        run: python tests/check_symbols.py python-module "$(python -c 'import lua; print(lua.__file__)')"

  embed:
    name: Embedding test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DLPB_BUILD_TESTS=ON -DLPB_LUA_APICHECK=ON \
            -DLUA_INCLUDE_DIR=$PWD/third_party/lua-5.5.1/src -DLPB_WARNINGS_AS_ERRORS=ON
          cmake --build build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -DLPB_BUILD_TESTS=ON -DLPB_LUA_TARGET=lpb_lua
          cmake --build build --config Release
      - name: Run (POSIX)
        if: runner.os != 'Windows'
        run: LUA_CPATH="$PWD/build/?.so" LUA_PYTHON_EXECUTABLE="$(command -v python3)" build/lpb_embed_test
      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set LUA_CPATH=%CD%\build\Release\?.dll
          for /f "delims=" %%p in ('python -c "import sys; print(sys.executable)"') do set LUA_PYTHON_EXECUTABLE=%%p
          build\Release\lpb_embed_test.exe

  sanitizers:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest
    env:
      SAN: -fsanitize=address,undefined -fno-omit-frame-pointer -g
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Lua 5.4 with sanitizers
        run: |
          sudo apt-get install -y libreadline-dev
          curl -sSfL https://www.lua.org/ftp/lua-5.4.7.tar.gz | tar xz
          make -C lua-5.4.7 -j4 linux CC=clang MYCFLAGS="$SAN -DLUA_USE_APICHECK" MYLDFLAGS="$SAN"
      - name: Build the Lua module and the embedding test with sanitizers
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN" -DCMAKE_MODULE_LINKER_FLAGS="$SAN" \
            -DLUA_INCLUDE_DIR=$PWD/lua-5.4.7/src
          cmake --build build
          cmake -S . -B build-embed -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN" -DCMAKE_MODULE_LINKER_FLAGS="$SAN" \
            -DLPB_BUILD_TESTS=ON -DLPB_LUA_APICHECK=ON -DLUA_INCLUDE_DIR=$PWD/third_party/lua-5.5.1/src
          cmake --build build-embed
      - name: Lua tests
        run: LUA_CPATH="$PWD/build/?.so" LUA_PYTHON_EXECUTABLE="$(command -v python3)" lua-5.4.7/src/lua tests/lua/run.lua
      - name: Embedding test
        run: LUA_CPATH="$PWD/build-embed/?.so" LUA_PYTHON_EXECUTABLE="$(command -v python3)" build-embed/lpb_embed_test

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
